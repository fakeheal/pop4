{{ define "main" }}
<section class="post-hero">
  <div class="wrap">
    <div class="crumbs"><span class="tag">{{ .Title }}</span><span class="meta">{{ len .Data.Terms }} {{ lower .Title }}</span></div>
    <h1><span class="section-title">{{ .Title }}</span></h1>
  </div>
</section>
<div class="wrap">
  <div class="filters terms">
    {{- range .Data.Terms.ByCount }}
    <a href="{{ .Page.RelPermalink }}">{{ if eq $.Data.Plural "tags" }}#{{ end }}{{ .Page.LinkTitle }} · {{ .Count }}</a>
    {{- end }}
  </div>
</div>
{{ end }}
