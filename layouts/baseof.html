<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body{{ with partial "section-class.html" . }} class="{{ . }}"{{ end }}>
{{ partial "header.html" . }}
<main>
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{- if and .IsPage (or .Params.steps (strings.Contains .Content "class=\"zoom\"")) }}{{ partial "lightbox.html" . }}{{ end }}
{{ block "scripts" . }}{{ end }}
</body>
</html>
