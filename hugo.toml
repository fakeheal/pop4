baseURL = "https://pop4.itodorova.dev"
locale = "en"
title = "pop iv"
enableRobotsTXT = true
capitalizeListTitles = false   # keep tag/game names as written (#marvel, Marvel Champions)
summaryLength = 30

[params]
  tagline = "break the 4th wall"
  description = "my personal space for all my hobbies"
  author = "iv"
  website = "https://itodorova.dev"   # footer link to my personal site

[taxonomies]
  tag = "tags"
  game = "games"

[pagination]
  pagerSize = 12

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html", "rss"]

[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false   # an image on its own line becomes a <figure>

[imaging]
  resampleFilter = "lanczos"
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 82

[sitemap]
  changeFreq = "weekly"
